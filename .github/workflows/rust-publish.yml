name: Rust Crate

on:
  push:
    branches: [master]
    paths:
      - 'kirun-rust/**'
  pull_request:
    paths:
      - 'kirun-rust/**'
  release:
    types: [created]

jobs:
  test:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'kirun-rust-')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # stable, and the crate's minimum supported Rust version (Cargo.toml rust-version)
        rust: [stable, "1.82"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kirun-rust
      - name: Run tests
        working-directory: ./kirun-rust
        run: cargo test --locked
      - name: Check the package
        working-directory: ./kirun-rust
        run: cargo publish --dry-run --locked

  publish-crates-io:
    needs: test
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'kirun-rust-')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write  # required for trusted publishing
    env:
      # crates.io can only configure trusted publishing on a crate that already exists, so the
      # first publish needs the CARGO_REGISTRY_TOKEN secret. Once trusted publishing is set up,
      # delete the secret and the auth action takes over.
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        working-directory: ./kirun-rust
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#kirun-rust-}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi
      # Exchanges the GitHub OIDC token for a short-lived crates.io token (trusted publishing).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_REGISTRY_TOKEN != 'true'
      - name: Publish to crates.io
        working-directory: ./kirun-rust
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
